name: Update Instagram Embed

on:
  schedule:
    - cron: '0 13 * * *' # daily, ~9am ET
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-instagram:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch latest Instagram post
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: node scripts/update-instagram.mjs

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- public/landingPage.txt; then
            echo "No changes to commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add public/landingPage.txt
            git commit -m "chore: update latest Instagram post"
            git push
          fi
